[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimsleuth"
version = "2.0.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claimsleuth = ["web/*", "agents/prompts/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Gemini API (needs GOOGLE_API_KEY); run with pytest -m live"]
addopts = "-m 'not live'"
